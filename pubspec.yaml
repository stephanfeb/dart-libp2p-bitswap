name: dart_libp2p_bitswap
description: An implementation of the Bitswap 1.2.0 block exchange protocol for dart_libp2p.
version: 2.0.0
repository: https://github.com/stephanfeb/dart-libp2p-bitswap
issue_tracker: https://github.com/stephanfeb/dart-libp2p-bitswap/issues
topics:
  - libp2p
  - ipfs
  - bitswap
  - p2p
  - networking

environment:
  sdk: ^3.5.0

dependencies:
  blake3_dart: ^1.0.0
  convert: ^3.1.2
  crypto: ^3.0.3
  dart_libp2p: ^4.12.0
  dart_multihash: ^1.0.1
  dcid: ^1.0.0
  logging: ^1.2.0
  meta: ^1.9.0
  pointycastle: ^3.9.1
  protobuf: ^3.1.0

dev_dependencies:
  dart_udx: ^4.3.0 # Transport for the example
  mockito: ^5.4.4
  analyzer: ^6.0.0  # Use a version compatible with mockito 5.4.5
  build_runner: ^2.4.13
  test: ^1.24.0
  lints: ^5.0.0
  fake_async: ^1.3.3 # Added fake_async

